<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1428"/>
      <stop offset="55%" stop-color="#12101C"/>
      <stop offset="100%" stop-color="#0A0812"/>
    </linearGradient>
    <radialGradient id="sGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#F0B429" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F0B429" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sLit" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="50%" stop-color="#F0B429"/>
      <stop offset="100%" stop-color="#C9920E"/>
    </radialGradient>
    <radialGradient id="sKnob" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF8E0"/>
      <stop offset="100%" stop-color="#F0C14A"/>
    </radialGradient>
    <filter id="sBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#sBg)"/>
  <rect width="1024" height="1024" fill="url(#sGlow)"/>

  <!-- light grid panel -->
  <g transform="translate(512,430)">
    <!-- panel backing -->
    <rect x="-280" y="-200" width="560" height="400" rx="48" fill="#1E1A2E" stroke="#2E2842" stroke-width="4"/>
    <rect x="-260" y="-180" width="520" height="360" rx="36" fill="#161222"/>

    <!-- 3×3 lights: pattern with corners + center ON (classic lights-puzzle read) -->
    <!-- row helper: cell size 120, gap 28, origin top-left of grid -->
  </g>

  <!-- draw lights explicitly for clarity -->
  <g>
    <!-- glow blobs behind lit cells -->
    <g filter="url(#sBlur)" opacity="0.7">
      <circle cx="332" cy="310" r="55" fill="#F0B429"/>
      <circle cx="692" cy="310" r="55" fill="#F0B429"/>
      <circle cx="512" cy="450" r="60" fill="#F0B429"/>
      <circle cx="332" cy="590" r="55" fill="#F0B429"/>
      <circle cx="692" cy="590" r="55" fill="#F0B429"/>
    </g>

    <!-- grid of 9 cells -->
    <!-- r0 -->
    <circle cx="332" cy="310" r="48" fill="url(#sLit)"/>
    <circle cx="512" cy="310" r="48" fill="#2A2438" stroke="#3A3348" stroke-width="4"/>
    <circle cx="692" cy="310" r="48" fill="url(#sLit)"/>
    <!-- r1 -->
    <circle cx="332" cy="450" r="48" fill="#2A2438" stroke="#3A3348" stroke-width="4"/>
    <circle cx="512" cy="450" r="48" fill="url(#sLit)"/>
    <circle cx="692" cy="450" r="48" fill="#2A2438" stroke="#3A3348" stroke-width="4"/>
    <!-- r2 -->
    <circle cx="332" cy="590" r="48" fill="url(#sLit)"/>
    <circle cx="512" cy="590" r="48" fill="#2A2438" stroke="#3A3348" stroke-width="4"/>
    <circle cx="692" cy="590" r="48" fill="url(#sLit)"/>

    <!-- specular on lit -->
    <g fill="#FFFFFF" opacity="0.45">
      <circle cx="318" cy="296" r="12"/>
      <circle cx="678" cy="296" r="12"/>
      <circle cx="498" cy="436" r="14"/>
      <circle cx="318" cy="576" r="12"/>
      <circle cx="678" cy="576" r="12"/>
    </g>
  </g>

  <!-- toggle switch at bottom — readable "switch" mark -->
  <g transform="translate(512,820)">
    <rect x="-150" y="-48" width="300" height="96" rx="48" fill="#2A2438" stroke="#3A3348" stroke-width="4"/>
    <!-- on track glow -->
    <rect x="-140" y="-38" width="280" height="76" rx="38" fill="#3D2E10"/>
    <rect x="0" y="-38" width="140" height="76" rx="38" fill="#F0B429" opacity="0.85"/>
    <!-- knob ON (right) -->
    <circle cx="100" cy="0" r="40" fill="url(#sKnob)"/>
    <circle cx="88" cy="-10" r="12" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>