<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A3D42"/>
      <stop offset="55%" stop-color="#0E5558"/>
      <stop offset="100%" stop-color="#147A72"/>
    </linearGradient>
    <radialGradient id="pGlow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pDial" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A5C5E"/>
      <stop offset="100%" stop-color="#0B3538"/>
    </linearGradient>
    <linearGradient id="pNeedle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#E8B84A"/>
    </linearGradient>
    <linearGradient id="pKeyW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFEF8"/>
      <stop offset="100%" stop-color="#E8E4D8"/>
    </linearGradient>
    <filter id="pSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#pBg)"/>
  <rect width="1024" height="1024" fill="url(#pGlow)"/>

  <!-- pitch dial -->
  <g transform="translate(512,440)">
    <!-- outer ring glow -->
    <circle cx="0" cy="0" r="290" fill="#5EEAD4" opacity="0.12" filter="url(#pSoft)"/>
    <!-- dial face -->
    <circle cx="0" cy="0" r="260" fill="url(#pDial)" stroke="#2A8A82" stroke-width="6"/>
    <circle cx="0" cy="0" r="220" fill="none" stroke="#1A6A68" stroke-width="3"/>

    <!-- tick marks (cents scale arc) -->
    <g stroke="#A8E8E0" stroke-linecap="round">
      <!-- major ticks every 30°, minor every 10° from -120 to +120 (top arc) -->
      <line x1="-151.6" y1="87.5" x2="-181.9" y2="105.0" stroke-width="5" opacity="0.95"/><line x1="-178.5" y1="65.0" x2="-197.3" y2="71.8" stroke-width="2.5" opacity="0.55"/><line x1="-187.1" y1="33.0" x2="-206.8" y2="36.5" stroke-width="2.5" opacity="0.55"/><line x1="-175.0" y1="-0.0" x2="-210.0" y2="-0.0" stroke-width="5" opacity="0.95"/><line x1="-187.1" y1="-33.0" x2="-206.8" y2="-36.5" stroke-width="2.5" opacity="0.55"/><line x1="-178.5" y1="-65.0" x2="-197.3" y2="-71.8" stroke-width="2.5" opacity="0.55"/><line x1="-151.6" y1="-87.5" x2="-181.9" y2="-105.0" stroke-width="5" opacity="0.95"/><line x1="-145.5" y1="-122.1" x2="-160.9" y2="-135.0" stroke-width="2.5" opacity="0.55"/><line x1="-122.1" y1="-145.5" x2="-135.0" y2="-160.9" stroke-width="2.5" opacity="0.55"/><line x1="-87.5" y1="-151.6" x2="-105.0" y2="-181.9" stroke-width="5" opacity="0.95"/><line x1="-65.0" y1="-178.5" x2="-71.8" y2="-197.3" stroke-width="2.5" opacity="0.55"/><line x1="-33.0" y1="-187.1" x2="-36.5" y2="-206.8" stroke-width="2.5" opacity="0.55"/><line x1="0.0" y1="-175.0" x2="0.0" y2="-210.0" stroke-width="5" opacity="0.95"/><line x1="33.0" y1="-187.1" x2="36.5" y2="-206.8" stroke-width="2.5" opacity="0.55"/><line x1="65.0" y1="-178.5" x2="71.8" y2="-197.3" stroke-width="2.5" opacity="0.55"/><line x1="87.5" y1="-151.6" x2="105.0" y2="-181.9" stroke-width="5" opacity="0.95"/><line x1="122.1" y1="-145.5" x2="135.0" y2="-160.9" stroke-width="2.5" opacity="0.55"/><line x1="145.5" y1="-122.1" x2="160.9" y2="-135.0" stroke-width="2.5" opacity="0.55"/><line x1="151.6" y1="-87.5" x2="181.9" y2="-105.0" stroke-width="5" opacity="0.95"/><line x1="178.5" y1="-65.0" x2="197.3" y2="-71.8" stroke-width="2.5" opacity="0.55"/><line x1="187.1" y1="-33.0" x2="206.8" y2="-36.5" stroke-width="2.5" opacity="0.55"/><line x1="175.0" y1="0.0" x2="210.0" y2="0.0" stroke-width="5" opacity="0.95"/><line x1="187.1" y1="33.0" x2="206.8" y2="36.5" stroke-width="2.5" opacity="0.55"/><line x1="178.5" y1="65.0" x2="197.3" y2="71.8" stroke-width="2.5" opacity="0.55"/><line x1="151.6" y1="87.5" x2="181.9" y2="105.0" stroke-width="5" opacity="0.95"/>
    </g>

    <!-- in-tune green zone arc at top center -->
    <path d="M-48,-202 A210,210 0 0,1 48,-202" fill="none" stroke="#5EEAD4" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

    <!-- needle pointing straight up (perfectly in tune) -->
    <g>
      <path d="M-10,40 L0,-175 L10,40 Z" fill="url(#pNeedle)"/>
      <circle cx="0" cy="48" r="28" fill="#E8B84A"/>
      <circle cx="0" cy="48" r="14" fill="#0B3538"/>
      <circle cx="-6" cy="40" r="5" fill="#FFE9A8" opacity="0.55"/>
    </g>

    <!-- soft "cents = 0" hint as concentric ring -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#5EEAD4" stroke-width="2" opacity="0.35"/>
  </g>

  <!-- piano key strip along bottom — secondary cue, not the whole mark -->
  <g transform="translate(512,860)">
    <rect x="-340" y="-70" width="680" height="140" rx="20" fill="#0A2E30"/>
    <!-- white keys -->
    <g>
      <rect x="-320" y="-55" width="74" height="110" rx="6" fill="url(#pKeyW)"/><rect x="-240" y="-55" width="74" height="110" rx="6" fill="url(#pKeyW)"/><rect x="-160" y="-55" width="74" height="110" rx="6" fill="url(#pKeyW)"/><rect x="-80" y="-55" width="74" height="110" rx="6" fill="url(#pKeyW)"/><rect x="0" y="-55" width="74" height="110" rx="6" fill="url(#pKeyW)"/><rect x="80" y="-55" width="74" height="110" rx="6" fill="url(#pKeyW)"/><rect x="160" y="-55" width="74" height="110" rx="6" fill="url(#pKeyW)"/><rect x="240" y="-55" width="74" height="110" rx="6" fill="url(#pKeyW)"/>
    </g>
    <!-- black keys -->
    <g fill="#1A1A1E">
      <rect x="-272" y="-55" width="44" height="68" rx="4"/>
      <rect x="-192" y="-55" width="44" height="68" rx="4"/>
      <rect x="-32" y="-55" width="44" height="68" rx="4"/>
      <rect x="48" y="-55" width="44" height="68" rx="4"/>
      <rect x="128" y="-55" width="44" height="68" rx="4"/>
      <rect x="288" y="-55" width="44" height="68" rx="4"/>
    </g>
  </g>
</svg>